# IntelliJ Platform Artifacts Repositories
# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-repositories-extension.html
pluginGroup=com.rumdl.intellij
pluginName=rumdl
pluginRepositoryUrl=https://github.com/rvben/rumdl
pluginVersion=0.1.4

# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-extension.html
pluginSinceBuild=252
pluginUntilBuild=261.*

# IntelliJ Platform Properties
# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
# Target IntelliJ IDEA Ultimate: has the LSP API (required) and bundles
# PythonCore (for the optional Python virtualenv integration). Building
# against IU lets JetBrains Marketplace offer the plugin in IDEA's in-IDE
# search in addition to PyCharm's, so users on IDEA Ultimate can find it.
platformType=IU
platformVersion=2025.3

# Plugin Dependencies
# https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
# No build-time plugin dependencies: the optional Python virtualenv
# integration (RumdlPythonService) uses reflection to reach the Python
# plugin API at runtime and returns null when it isn't installed.
platformPlugins=
platformBundledPlugins=

# Gradle Configuration
org.gradle.jvmargs=-Xmx2048m
# Disable configuration cache due to IntelliJ Platform plugin compatibility
org.gradle.configuration-cache=false

# Gradle Releases
# https://github.com/gradle/gradle/releases
gradleVersion=8.13

# Kotlin version
kotlin.stdlib.default.dependency=false

# Pinned rumdl version for the real-server LSP contract test
# (`integrationTest`). The test asserts exact formatter output, so it must run
# against a known rumdl, not a moving "latest". Single source of truth: the
# Makefile installs exactly this version. Bump deliberately when adopting new
# rumdl formatting behaviour.
rumdlContractVersion=0.1.94
